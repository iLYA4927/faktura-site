<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ФАКТУРА — бамбуковые панели</title>
<meta name="description" content="ФАКТУРА — бамбуковые панели в Набережных Челнах.">
<style>
html,body{margin:0;min-height:100%;background:#f5f0e8;color:#211e1a;font-family:Arial,"Segoe UI",sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
#boot b{font:600 30px Georgia,"Times New Roman",serif;letter-spacing:.14em}
#boot span{display:block;margin-top:12px;color:#786f66;font-size:13px}
</style>
</head>
<body>
<div id="boot"><div><b>ФАКТУРА</b><span>Загружаем сайт…</span></div></div>
<script>
(async()=>{
  const parts=Array.from({length:32},(_,i)=>"approved-v33-20260926/part-"+String(i).padStart(3,"0")+".txt");
  const texts=await Promise.all(parts.map(async p=>{
    const r=await fetch(p+"?v=39",{cache:"no-store"});
    if(!r.ok) throw new Error(p+" "+r.status);
    return r.text();
  }));
  let html=texts.join("");

  document.open();
  document.write(html);
  document.close();
})().catch(err=>{
  document.getElementById("boot").innerHTML="<div><b>ФАКТУРА</b><span>Обновите страницу через несколько секунд.</span></div>";
  console.error(err);
});
</script>
</body>
</html>
